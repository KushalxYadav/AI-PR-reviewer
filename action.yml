name: 'AI PR Reviewer (Gemini)'
description: 'AI-powered GitHub Pull Request code reviewer using Google Gemini (Gemini 4 Argon). Posts a summary comment and inline review comments.'
author: 'AI PR Reviewer Contributors'

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  GEMINI_API_KEY:
    description: 'Google Gemini API key (required, pass from GitHub Secrets).'
    required: false
  GEMINI_MODEL:
    description: 'Optional Gemini model ID override. Defaults to DEFAULT_GEMINI_MODEL.'
    required: false
  github_token:
    description: 'GitHub token used to fetch diffs and post comments.'
    required: false
    default: ${{ github.token }}
  config_path:
    description: 'Path to optional configuration file in the repository.'
    required: false
    default: '.reviewbot.yml'

runs:
  using: 'node20'
  main: 'dist/index.js'
